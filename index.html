<!DOCTYPE html>
<!-- mock-door: practice only — fake guests, no Airtable -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>House of LouLou's — Mock Door</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mock Door">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#162B3B">
  <link rel="icon" type="image/png" href="mock-app-icon.png">
  <link rel="apple-touch-icon" href="mock-app-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#162B3B; --cream:#f5f0eb; --dark:#1a1a1a; --warm:#8c7b6b; --accent:#c9a96e; --green:#34c759; --red:#c0392b; --border:rgba(0,0,0,0.07); }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { font-family:'Instrument Serif',serif; font-style:normal; }
    body { background:#f2ede8; font-family:'Instrument Serif',serif; color:var(--dark); min-height:100vh; font-style:normal; }
    button, input, textarea, select, option { font-family:'Instrument Serif',serif; }
    #app, #detailView, #addModal, #evScreen, button, input, textarea, select { font-style:normal; }
    #evScreen{position:fixed;inset:0;background:var(--blue);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;min-height:100dvh;padding:max(14px, env(safe-area-inset-top)) 24px max(12px, env(safe-area-inset-bottom));overflow-y:auto;}
    .ev-main{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;min-height:0;padding-top:4px;}
    /* Logo: no blend/filter — avoids Safari “black box” on PNG over blue */
    .ev-logo,.logo-img{height:auto;width:auto;display:block;mix-blend-mode:normal;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
    .ev-logo-link{display:inline-flex;line-height:0;margin-bottom:0;-webkit-tap-highlight-color:transparent;}
    .ev-logo-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px;}
    .ev-logo{height:62px;margin-bottom:0;}
    .ev-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:32px;margin-top:12px;}
    .ev-mock-badge{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-top:14px;margin-bottom:0;font-weight:600;}
    #evScreen .ev-list{width:100%;max-width:min(100%,320px);display:flex;flex-direction:column;flex-wrap:nowrap;gap:0;row-gap:0;column-gap:0;padding:0 0 28px;box-sizing:border-box;}
    #evScreen .ev-list>button.ev-item+.ev-item{margin-top:36px;}
    button.ev-item.ev-item-art{
      display:block;width:100%;padding:0;margin:0;border:none;border-radius:12px;cursor:pointer;
      background:var(--blue);overflow:hidden;-webkit-tap-highlight-color:transparent;line-height:0;position:relative;
      box-shadow:0 4px 18px rgba(0,0,0,.35);
      transition:transform .16s,box-shadow .16s,opacity .16s;
    }
    button.ev-item.ev-item-art::after{content:none;}
    button.ev-item.ev-item-art:hover{box-shadow:0 6px 22px rgba(0,0,0,.45);}
    button.ev-item.ev-item-art:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
    button.ev-item.ev-item-art:active{transform:scale(.985);opacity:.95;}
    #evScreen .ev-list>button.ev-item.ev-item-art:last-child{box-shadow:0 2px 10px rgba(0,0,0,.28);}
    #evScreen .ev-list>button.ev-item.ev-item-art:last-child:hover{box-shadow:0 3px 14px rgba(0,0,0,.38);}
    .ev-item-art .ev-art{
      display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;vertical-align:bottom;
      border:0;outline:0;border-radius:12px;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
      transform:translateZ(0);
    }
    #evScreen .ev-landing-spacer{flex:0 0 auto;width:100%;min-height:20px;max-height:20px;pointer-events:none;}
    #evScreen .ev-reset{position:relative;z-index:2;flex-shrink:0;width:100%;max-width:min(100%,320px);margin-top:0;padding:8px 12px max(20px, env(safe-area-inset-bottom));background:var(--blue);border:none;cursor:pointer;text-align:center;-webkit-font-smoothing:antialiased;font-size:13px;font-weight:500;letter-spacing:.05em;color:rgba(255,255,255,.78);}
    #app{display:none;}
    .list-header{background:var(--blue);position:sticky;top:0;z-index:100;}
    .list-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px;}
    .logo-link{display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent;background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;}
    .logo-img{height:28px;width:auto;display:block;}
    .logo-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px;}
    .event-title-row{padding:0 16px 8px;text-align:center;}
    .event-title{font-size:18px;font-style:normal;color:rgba(255,255,255,.92);letter-spacing:.02em;line-height:1.25;}
    .toolbar{display:flex;gap:8px;padding:0 14px 12px;}
    .search-wrap{flex:1;position:relative;}
    .search-input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 12px 9px 32px;font-size:13px;color:#fff;outline:none;}
    .search-input::placeholder{color:rgba(255,255,255,.3);}
    .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:13px;pointer-events:none;}
    .hbtn{background:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 12px;font-size:11px;letter-spacing:.06em;color:#fff;cursor:pointer;white-space:nowrap;}
    .hbtn.nda{border-color:var(--accent);color:var(--accent);}
    /* Door list tabs (four segments). */
    .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:6px;row-gap:4px;align-items:stretch;padding:0 6px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.07);}
    .tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 2px;font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:rgba(255,255,255,.38);cursor:pointer;white-space:normal;line-height:1.15;text-align:center;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;transition:all .18s;-webkit-hyphens:manual;hyphens:manual;}
    .tab.active{color:#fff;border-bottom-color:var(--accent);}
    @media(min-width:400px){
      .tab{padding:10px 4px;font-size:11px;letter-spacing:.05em;}
    }
    @media(min-width:520px){
      .tab{padding:11px 8px;font-size:12px;letter-spacing:.08em;}
    }
    .stats{padding:9px 16px;display:flex;gap:14px;background:var(--cream);border-bottom:1px solid var(--border);}
    .stat{font-size:12px;color:var(--warm);}
    .stat-pending{color:var(--accent);}
    .stat b{color:var(--dark);font-style:normal;font-weight:400;}
    /** Guest grid: flex-wrap + centered rows. */
    #main{width:100%;}
    .grid{
      --ggrid:10px;
      --guest-card-w:clamp(138px,min(206px,(100vw - 48px)/3),216px);
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:stretch;
      align-content:flex-start;
      gap:var(--ggrid);
      padding:14px;
      max-width:1200px;
      margin:0 auto;
      box-sizing:border-box;
      width:100%;
    }
    .grid>.card{flex:0 0 auto;width:var(--guest-card-w);}
    .card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.07);transition:transform .12s,filter .15s,opacity .15s;}
    .card:active{transform:scale(.96);}
    .card.checked{filter:grayscale(1);opacity:.62;}
    .card-photo{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e8e2da;}
    .card-init{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#ebe5dd,#d9d1c7);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--warm);}
    .card-body{padding:7px 8px 8px;}
    .card-name{font-size:11px;color:var(--dark);line-height:1.3;}
    .card-tick{color:var(--blue);font-size:16px;margin-right:4px;font-weight:700;line-height:1;}
    .card-tag{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--warm);margin-top:2px;display:flex;align-items:center;gap:3px;}
    .wb-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
    .wb-gold{background:#c9a96e;}
    .wb-black{background:#1a1a1a;border:1px solid #bbb;}
    .cstate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;gap:14px;}
    .spinner{width:26px;height:26px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .cstate-txt{font-size:13px;color:var(--warm);letter-spacing:.1em;}
    #detailView{display:none;position:fixed;inset:0;background:#f2ede8;z-index:200;overflow-y:auto;}
    .detail-head{background:var(--blue);padding:0 0 24px;text-align:center;}
    .detail-nav{display:flex;align-items:center;padding:14px 16px 0;}
    .back-btn{background:none;border:none;color:rgba(255,255,255,.92);cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:1;display:flex;align-items:center;padding:4px 0;text-align:left;-webkit-font-smoothing:antialiased;}
    .detail-avatar-wrap{margin-top:14px;display:flex;justify-content:center;}
    .detail-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #fff;}
    .detail-init{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;}
    .detail-name{font-size:22px;color:#fff;margin-top:10px;}
    .detail-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.06em;}
    .detail-chips{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap;padding:0 20px;}
    .det-chip{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);border-radius:6px;padding:5px 12px;font-size:11px;text-decoration:none;}
    .det-cards{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:40px;}
    .det-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .det-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.05);}
    .det-row:last-of-type{border-bottom:none;}
    .det-row-left{display:flex;flex-direction:column;gap:2px;}
    .det-lbl{font-size:14px;color:var(--dark);display:flex;align-items:center;gap:6px;}
    .wb-display{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.05);}
    .wb-display-lbl{font-size:14px;color:var(--dark);margin-bottom:2px;}
    .det-sublbl{font-size:11px;color:var(--warm);line-height:1.35;}
    .det-sublbl{margin-top:2px;}
    .wb-pill{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 16px;font-size:14px;border:1.5px solid rgba(0,0,0,.08);}
    .wb-pill.none{color:var(--warm);}
    .wb-pill.gold{background:#fffdf0;border-color:#c9a96e;color:#8a6820;}
    .wb-pill.black{background:#1a1a1a;border-color:#1a1a1a;color:#fff;}
    #wbPillDisplay{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
    .wb-circle{width:12px;height:12px;border-radius:50%;}
    .wb-circle.gold{background:#c9a96e;}
    .wb-circle.black{background:#fff;}
    .nda-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff5f5;border-top:1px solid rgba(0,0,0,.05);}
    .nda-text{font-size:12px;color:var(--red);display:flex;align-items:flex-start;gap:6px;line-height:1.5;flex:1;}
    .nda-link{font-size:18px;cursor:pointer;flex-shrink:0;text-decoration:none;}
    .toggle{position:relative;width:51px;height:31px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;position:absolute;}
    .slider{position:absolute;cursor:pointer;inset:0;background:#e0dad3;border-radius:31px;transition:.2s;}
    .slider:before{content:'';position:absolute;width:25px;height:25px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.15);}
    .toggle input:checked+.slider{background:var(--green);}
    .toggle input:checked+.slider:before{transform:translateX(20px);}
    .saving-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:20px;padding:10px 16px;font-size:12px;letter-spacing:.02em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;max-width:min(92vw,420px);max-height:40vh;overflow-y:auto;word-break:break-word;line-height:1.35;text-align:center;}
    .saving-toast.show{opacity:1;}
    .det-input-wrap{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.05);}
    .det-input-wrap:last-child{border-bottom:none;}
    .det-input-lbl{font-size:13px;color:var(--dark);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
    .det-input{width:100%;background:#f5f2ee;border:none;border-radius:8px;padding:10px 14px;font-size:14px;color:var(--warm);outline:none;}
    .det-input::placeholder{color:#bbb5ae;font-style:normal;}
    #addModal .det-input::placeholder{font-style:normal;}
    textarea.det-input{resize:none;min-height:80px;}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;}
    .modal-bg.open{opacity:1;pointer-events:all;}
    .modal{background:#f2ede8;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding-bottom:40px;}
    .modal-handle{width:36px;height:4px;background:rgba(0,0,0,.1);border-radius:2px;margin:12px auto 0;}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;}
    .modal-title{font-size:22px;color:var(--dark);}
    .modal-close{background:none;border:none;font-size:22px;color:var(--warm);cursor:pointer;}
    .modal-body{padding:0 14px;display:flex;flex-direction:column;gap:12px;}
    #addModalBody.add-at .add-sec-name{order:1;}
    #addModalBody.add-at .add-sec-ci{order:2;}
    #addModalBody.add-at .add-sec-wb{order:3;}
    #addModalBody.add-at .add-sec-mdate{order:9;display:none !important;}
    #addModalBody.add-at .add-sec-coat{order:4;}
    #addModalBody.add-at .add-sec-phone{order:5;}
    #addModalBody.add-at .add-sec-notes{order:6;}
    .modal-card{background:#fff;border-radius:14px;overflow:hidden;}
    .modal-row{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.05);display:flex;align-items:center;gap:10px;}
    .modal-row:last-child{border-bottom:none;}
    .modal-ico{font-size:16px;flex-shrink:0;}
    .modal-field{flex:1;}
    .modal-field-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm);margin-bottom:2px;}
    .modal-input{width:100%;background:none;border:none;outline:none;font-size:15px;color:var(--dark);}
    .modal-input::placeholder{color:#c0b8ae;}
    .modal-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.05);}
    .modal-toggle-row:last-child{border-bottom:none;}
    .modal-toggle-lbl{font-size:14px;color:var(--dark);display:flex;align-items:center;gap:8px;}
    .modal-nda-hint{padding:10px 16px 14px;font-size:12px;color:var(--red);display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid rgba(0,0,0,.05);line-height:1.4;}
    .modal-nda-link{font-size:16px;text-decoration:none;flex-shrink:0;}
    .modal-actions{display:flex;gap:10px;padding:14px 14px 0;}
    .mcancel{flex:1;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:12px;padding:14px;font-size:13px;cursor:pointer;color:var(--dark);}
    .msubmit{flex:2;background:var(--blue);border:none;border-radius:12px;padding:14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;cursor:pointer;font-weight:500;}
    /* Narrow phones: keep this block LAST so it wins over min-width:.tab rules above */
    @media(max-width:480px){
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
      #evScreen .ev-list>button.ev-item+.ev-item{margin-top:40px;}
      #evScreen .ev-landing-spacer{min-height:24px;max-height:24px;}
      #evScreen .ev-reset{font-size:14px;}
      .ev-sub{font-size:13px;letter-spacing:.14em;}
      .event-title{font-size:24px;line-height:1.28;letter-spacing:0;}
      .toolbar{flex-wrap:wrap;row-gap:8px;}
      .search-wrap{flex:1 1 100%;min-width:0;}
      .search-input,.s-icon{font-size:17px;}
      .hbtn{flex:1 1 calc(50% - 4px);min-width:0;font-size:13px;padding:9px 5px;letter-spacing:.03em;white-space:normal;text-align:center;line-height:1.2;}
      .tabs{padding:0 4px;column-gap:4px;}
      .tabs .tab{padding:11px 1px;font-size:13px;letter-spacing:0;line-height:1.15;}
      .stat{font-size:15px;}
      .card-body{padding:9px 8px 10px;}
      .card-name{font-size:16px;line-height:1.35;}
      .card-tag{font-size:13px;letter-spacing:.04em;margin-top:3px;}
      .card-tick{font-size:20px;}
      .cstate-txt{font-size:15px;}
      .back-btn{font-size:15px;}
      .detail-name{font-size:28px;}
      .detail-sub,.det-chip{font-size:14px;}
      .det-lbl,.wb-display-lbl{font-size:17px;}
      .det-sublbl{font-size:13px;}
      .wb-pill{font-size:16px;}
      .nda-text{font-size:14px;}
      .det-input,.det-input-lbl{font-size:16px;}
      .modal-title{font-size:24px;}
      .modal-toggle-lbl{font-size:16px;}
      .modal-field-lbl{font-size:12px;}
      .modal-input{font-size:17px;}
      .mcancel,.msubmit{font-size:15px;}
    }
  </style>
</head>
<body>
  <div class="saving-toast" id="toast">Saved ✓</div>

  <div id="evScreen">
    <div class="ev-main">
      <a class="ev-logo-link" href="https://www.houseofloulous.com/" target="_blank" rel="noopener noreferrer" title="House of LouLou's — main site">
        <img class="ev-logo" src="https://cdn.jsdelivr.net/gh/houseofloulous/loulous-doorlist@main/LL%20white%20logo%20name%20only.png" alt="LouLou's">
      </a>
      <div class="ev-mock-badge">Practice app</div>
      <div class="ev-sub" id="evLandingSubtitle">Select event</div>
      <div class="ev-list" id="evList"></div>
    </div>
    <div class="ev-landing-spacer" aria-hidden="true"></div>
    <button type="button" class="ev-reset" onclick="resetKey()">Reset practice password</button>
  </div>

  <div id="app">
    <div class="list-header">
      <div class="list-top">
        <button type="button" class="logo-link" onclick="showEvScreen()" title="Back to event selection" aria-label="Back to event selection">
          <img class="logo-img" src="https://cdn.jsdelivr.net/gh/houseofloulous/loulous-doorlist@main/LL%20white%20logo%20name%20only.png" alt="LouLou's">
        </button>
      </div>
      <div class="event-title-row"><div class="event-title" id="eventTitle"></div></div>
      <div class="toolbar">
        <div class="search-wrap">
          <span class="s-icon">⌕</span>
          <input class="search-input" id="searchInput" type="text" placeholder="Search guests…" oninput="render()">
        </div>
        <button class="hbtn" onclick="openAdd()">+ ADD NEW GUEST</button>
        <button type="button" class="hbtn nda" id="ndaToolbarBtn" onclick="openNdaForm()">NDA</button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="main"></div>
  </div>

  <div id="detailView"><div id="detailContent"></div></div>


  <div class="modal-bg" id="addModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-head">
        <div class="modal-title">Add New Guest</div>
        <button class="modal-close" onclick="closeAdd()">×</button>
      </div>
      <div class="modal-body add-at" id="addModalBody">
        <div class="modal-card add-sec add-sec-name">
          <div class="det-input-wrap" style="border-bottom:none">
            <div class="det-input-lbl">Full name <span style="color:var(--red)">Required</span></div>
            <input class="det-input" id="aN" type="text" placeholder="" autocomplete="name">
          </div>
        </div>
        <div class="modal-card add-sec add-sec-ci">
          <div class="det-row" style="border-bottom:none">
            <div class="det-lbl">✓ Checked In</div>
            <label class="toggle"><input type="checkbox" id="mCI"><span class="slider"></span></label>
          </div>
        </div>
        <div class="modal-card add-sec add-sec-mdate" id="mGuestDateBlock" style="display:none">
          <div class="det-input-wrap" style="border-bottom:none">

    function getTabsForCurrentTable(){ return BASE_TABS; }

    function listSegmentsLower(g){
      const s=(g.list||'').toLowerCase()
        .replace(/\s*·\s*/g,',')
        .replace(/\s*\/\s*/g,',')
        .replace(/\s+and\s+/g,',')
        .replace(/\n+/g,',');
      return s.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
    }
    function normListKey(s){
      return String(s==null?'':s).toLowerCase().replace(/[\u0027\u2019]/g,'').replace(/\s+/g,'');
    }
    function listFieldMatches(g, tokenOrLabel){
      const want=normListKey(tokenOrLabel);
      return listSegmentsLower(g).some(seg=>normListKey(seg)===want);
    }
    function guestIsTableGuest(g){
      if(!g) return false;
      return listFieldMatches(g,'table')||listFieldMatches(g,'tables');
    }
    function normalizeMockGuest(g){
      const wristbands=[];
      if(g.wristband==='Gold') wristbands.push('Gold');
      if(g.wristband==='Black') wristbands.push('Black');
      const tableGuest=guestIsTableGuest(g);
      const stiVerified=typeof g.stiVerified==='boolean'?g.stiVerified:wristbands.includes('Black');
      return {
        ...g,
        tableGuest,
        stiVerified,
        wristbands,
        wristband:wristbands.includes('Gold')?'Gold':(wristbands.includes('Black')?'Black':''),
        ndaSigned:ndaIsSigned(g.nda),
        coatCheck:g.coatCheck||'',
        phoneCheckNum:g.phoneCheckNum||'',
        doorNotes:g.doorNotes||'',
        dateClusterMates:[],
        guestDate:'',
        seatAssignment:'',
      };
    }
    function cloneMockGuests(key){
      return (MOCK_GUESTS[key]||[]).map(normalizeMockGuest);

    function sortGuestsByName(list){
      return [...list].sort((a,b)=>{
        const an=(a?.name||'').trim();

        return an.localeCompare(bn,undefined,{sensitivity:'base'});
      });

        `<img class="ev-art" src="${esc(e.art)}" alt="${esc(e.label)}" width="800" height="450" loading="eager" decoding="async">` +
        `</button>`
      ).join('');
    }

      const e=EVENTS[i];
      if(!e) return;
      curTable=e.table;
      curTab=defaultTabForCurrentTable();
      document.getElementById('eventTitle').textContent=e.label;
      document.getElementById('evScreen').style.display='none';
      document.getElementById('app').style.display='block';
      load();
    }
    function showEvScreen(){
      if(EVENTS.length===1){ pickEv(0); return; }
      document.getElementById('evScreen').style.display='flex';
      document.getElementById('app').style.display='none';
      document.getElementById('detailView').style.display='none';
    }
    function guestMatchesSearch(g,q){
      const em=(g.email||'').toLowerCase();
      return (g.name||'').toLowerCase().includes(q)||(g.phone||'').includes(q)||em.includes(q)
        ||String(g.phoneCheckNum||'').toLowerCase().includes(q);
    }

      document.getElementById('main').innerHTML='<div class="cstate"><div class="spinner"></div><div class="cstate-txt">Opening the doors…</div></div>';

      }
    }
    function buildTabs(){
      const tabs=getTabsForCurrentTable();
      if(!tabs.some(t=>t.id===curTab)) curTab=tabs[0].id;
      const wrap=document.getElementById('tabs');
      wrap.className='tabs';
      wrap.setAttribute('aria-label','Guest segments');
      wrap.innerHTML=tabs.map(t=>
        `<button type="button" role="tab" class="tab ${t.id===curTab?'active':''}" aria-selected="${t.id===curTab?'true':'false'}" onclick="setTab('${esc(t.id)}')">${esc(t.lbl)}</button>`
      ).join('');
    }
    function setTab(id){ curTab=id; buildTabs(); render(); }
    function render(){
      const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
      let list=guests;
      if(curTab==='tables') list=list.filter(g=>listFieldMatches(g,'table')||listFieldMatches(g,'tables'));
      else if(curTab==='guest') list=list.filter(g=>{
        const segs=listSegmentsLower(g);
        if(!segs.length) return true;
        return !listFieldMatches(g,'working');
      });
      else if(curTab==='working') list=list.filter(g=>listFieldMatches(g,'working'));
      if(q) list=list.filter(g=>guestMatchesSearch(g,q));
      list=[...list].sort((a,b)=>{
        if(!!a.checkedIn!==!!b.checkedIn) return a.checkedIn?1:-1;
        return (a.name||'').localeCompare((b.name||''),undefined,{sensitivity:'base'});
      });
      const chk=list.filter(g=>g.checkedIn).length;
      document.getElementById('stats').innerHTML=`<div class="stat"><b>${list.length}</b> guests</div><div class="stat"><b>${chk}</b> checked in</div>`;
      if(!list.length){
        document.getElementById('main').innerHTML='<div class="cstate"><div class="cstate-txt">No guests found</div></div>';
        return;
      }
      document.getElementById('main').innerHTML=`<div class="grid">${list.map(gCard).join('')}</div>`;
    }
    function gCard(g){
      const ph=g.photo
        ?`<img class="card-photo" src="${esc(g.photo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="card-init" style="display:none">${ini(g.name)}</div>`
        :`<div class="card-init">${ini(g.name)}</div>`;
      const showGoldDot=g.tableGuest||!!(g.wristbands&&g.wristbands.includes('Gold'));
      const dot=(showGoldDot?`<span class="wb-dot wb-gold"></span>`:'')+(g.stiVerified?`<span class="wb-dot wb-black"></span>`:'');
      const listTag=`<div class="card-tag">${dot}${esc(g.list||'')}</div>`;
      return `<div class="card${g.checkedIn?' checked':''}" onclick="openDetail('${g.id}')">
        ${ph}
        <div class="card-body">
          <div class="card-name">${g.checkedIn?'<span class="card-tick">✓</span>':''}${esc(g.name)}</div>
          ${listTag}
        </div>
      </div>`;
    }
    function openDetail(id){
      const g=guests.find(x=>x.id===id); if(!g) return;
      curG=g;
      const loc=local[id]||{};
      const coatVal=loc.coat!=null?loc.coat:(g.coatCheck||'');
      const phoneCheckVal=loc.phoneCheck!=null?loc.phoneCheck:(g.phoneCheckNum||'');
      const notesVal=loc.notes!=null?loc.notes:(g.doorNotes||'');
      const ph=g.photo?`<img class="detail-avatar" src="${esc(g.photo)}" alt="${esc(g.name)}">`:`<div class="detail-init">${ini(g.name)}</div>`;
      const hasGoldPill=g.tableGuest||!!(g.wristbands&&g.wristbands.includes('Gold'));
      const wbPill=buildWBDisplayHTML(hasGoldPill,!!g.stiVerified);
      const ndaSig=typeof g.ndaSigned==='boolean'?g.ndaSigned:ndaIsSigned(g.nda);
      const ndaRow=!ndaSig
        ?`<div class="nda-row"><div class="nda-text">🔴 If NDA is unsigned, please click here and have them sign:</div><a class="nda-link" href="${NDA_FORM_URL}" target="_blank" rel="noopener noreferrer">🔗</a></div>`
        :'';
      document.getElementById('detailContent').innerHTML=`
        <div class="detail-head">
          <div class="detail-nav"><button type="button" class="back-btn" onclick="closeDetail()" aria-label="Back to guest list">BACK</button></div>
          <div class="detail-avatar-wrap">${ph}</div>
          <div class="detail-name">${esc(g.name)}</div>
          <div class="detail-sub">${esc(g.list||'')}${g.rsvp?' · RSVP: '+esc(g.rsvp):''}</div>
          <div class="detail-chips">
            ${g.phone?`<a class="det-chip" href="tel:${esc(g.phone)}">📞 ${esc(g.phone)}</a>`:''}
            ${g.email?`<a class="det-chip" href="mailto:${esc(g.email)}">✉️ ${esc(g.email)}</a>`:''}
          </div>
        </div>
        <div class="det-cards">
          <div class="det-card">
            <div class="det-row">
              <div class="det-lbl">✓ Checked In:</div>
              <label class="toggle"><input type="checkbox" id="dCI" ${g.checkedIn?'checked':''} onchange="autoSave()"><span class="slider"></span></label>
            </div>
            <div class="wb-display">
              <div class="wb-display-lbl">Wristbands</div>
              <div id="wbPillDisplay">${wbPill}</div>
            </div>
            <div class="det-row">
              <div class="det-row-left">
                <div class="det-lbl">Tables</div>
                <div class="det-sublbl">💛 Table guests receive GOLD WRISTBANDS</div>
              </div>
              <label class="toggle" title="Practice: set List to Table in mock data"><input type="checkbox" id="dTbl" ${g.tableGuest?'checked':''} disabled aria-readonly="true"><span class="slider"></span></label>
            </div>
            <div class="det-row">
              <div class="det-row-left">
                <div class="det-lbl">STI Tests Verified</div>
                <div class="det-sublbl">🖤 Verified guests receive BLACK WRISTBANDS</div>
              </div>
              <label class="toggle"><input type="checkbox" id="dSTI" ${g.stiVerified?'checked':''} onchange="onSTI(this)"><span class="slider"></span></label>
            </div>
            <div class="det-row">
              <div class="det-lbl">🤫 NDA Signed:</div>
              <label class="toggle"><input type="checkbox" id="dNDA" ${ndaSig?'checked':''} onchange="onNDA(this)"><span class="slider"></span></label>
            </div>
            <div id="ndaBox">${ndaRow}</div>
          </div>
          <div class="det-card">
            <div class="det-input-wrap">
              <div class="det-input-lbl">🧥 Coat Check #</div>
              <input class="det-input" id="dCoat" value="${esc(coatVal)}" placeholder="e.g. 69" onblur="saveLocal()">
            </div>
          </div>
          <div class="det-card">
            <div class="det-input-wrap">
              <div class="det-input-lbl">📱 Phone Check #</div>
              <input class="det-input" id="dPhoneCheck" value="${esc(phoneCheckVal)}" placeholder="e.g. 69" onblur="saveLocal()">
            </div>
          </div>
          <div class="det-card">
            <div class="det-input-wrap">
              <div class="det-input-lbl">📝 Door Notes:</div>
              <textarea class="det-input" id="dNotes" placeholder="Issues at the Door" onblur="saveLocal()">${esc(notesVal)}</textarea>
            </div>
          </div>
        </div>`;
      document.getElementById('app').style.display='none';
      document.getElementById('detailView').style.display='block';
      document.getElementById('detailView').scrollTop=0;
    }
    function updateWBDisplay(){
      const box=document.getElementById('wbPillDisplay');
      const sti=document.getElementById('dSTI');
      if(!box||!curG)return;
      const hasGoldFromBands=!!(Array.isArray(curG.wristbands)&&curG.wristbands.includes('Gold'));
      const tableGuest=guestIsTableGuest(curG);
      const hasGold=tableGuest||hasGoldFromBands;
      const cS=sti && sti.checked;
      box.innerHTML=buildWBDisplayHTML(hasGold,cS);
    }
    function onSTI(cb){ updateWBDisplay(); autoSave(); }
    function onNDA(cb){
      document.getElementById('ndaBox').innerHTML=cb.checked?'':`<div class="nda-row"><div class="nda-text">🔴 If NDA is unsigned, please click here and have them sign:</div><a class="nda-link" href="${NDA_FORM_URL}" target="_blank" rel="noopener noreferrer">🔗</a></div>`;
      autoSave();
    }
    function onAddNDAChange(cb){
      const hint=document.getElementById('mNdaHint');
      if(!hint)return;
      hint.style.display=cb.checked?'none':'flex';
    }
    function saveLocal(){
      if(!curG)return;
      const coat=document.getElementById('dCoat');
      const phoneCheck=document.getElementById('dPhoneCheck');
      const notes=document.getElementById('dNotes');
      if(!coat||!notes)return;
      const vCoat=coat.value.trim();
      const vPhone=phoneCheck?phoneCheck.value.trim():'';
      const vNotes=notes.value.trim();
      local[curG.id]={coat:vCoat,phoneCheck:vPhone,notes:vNotes};
      const i=guests.findIndex(x=>x.id===curG.id);
      if(i>-1){
        guests[i]={...guests[i],coatCheck:vCoat,phoneCheckNum:vPhone,doorNotes:vNotes};
        if(curG.id===guests[i].id) curG=guests[i];
      }
      showToast('Saved (practice) ✓');
    }
    let saveTimer=null;
    function autoSave(){
      clearTimeout(saveTimer);
      const myGen=++saveGen;
      saveTimer=setTimeout(()=>{
        if(!curG)return;
        if(myGen!==saveGen) return;
        const dCI=document.getElementById('dCI');
        const dNDA=document.getElementById('dNDA');
        const stiEl=document.getElementById('dSTI');
        if(!dCI||!dNDA)return;
        const cI=dCI.checked;
        const cN=dNDA.checked;
        const cS=stiEl && stiEl.checked;
        const wb=[];
        const tableGuest=guestIsTableGuest(curG);
        if(tableGuest) wb.push('Gold');
        if(cS) wb.push('Black');
        const i=guests.findIndex(g=>g.id===curG.id);
        if(i>-1){
          guests[i]={
            ...guests[i],
            checkedIn:cI,
            nda:cN?'Signed':'No',
            ndaSigned:!!cN,
            stiVerified:cS,
            wristbands:wb,
            wristband:wb.includes('Gold')?'Gold':(wb.includes('Black')?'Black':''),
            sti:cS
          };
          curG=guests[i];
        }
        showToast('Saved (practice) ✓');
        try{ render(); }catch(_){}
      },400);
    }
    function closeDetail(){
      saveGen++;
      document.getElementById('detailView').style.display='none';
      document.getElementById('app').style.display='block';
      curG=null;
      render();
    }
    function openAdd(){
      document.getElementById('addModal').classList.add('open');
      const mb=document.getElementById('addModalBody');
      if(mb) mb.className='modal-body add-at';
      document.getElementById('aN').focus();
      const mgb=document.getElementById('mGuestDateBlock');
      if(mgb) mgb.style.display='none';
      const mnl=document.getElementById('mNotesLbl');
      if(mnl) mnl.innerHTML='📝 Door Notes: <span style="color:var(--red)">Required</span>';
      const mn=document.getElementById('mNotes');
      if(mn) mn.placeholder='Any additional info including who approved them (Sam, Daniel & LouLou are the only ones who can)';
      const nda=document.getElementById('mNDA');
      if(nda) onAddNDAChange(nda);
      updateAddWbPills();
    }
    function closeAdd(){
      document.getElementById('addModal').classList.remove('open');
      const mbReset=document.getElementById('addModalBody');
      if(mbReset) mbReset.className='modal-body add-at';
      ['aN','mCoat','mPhoneCheck','mNotes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
      ['mCI','mNDA','mSTI'].forEach(id=>{
        const n=document.getElementById(id);
        if(n) n.checked=false;
      });
      onAddNDAChange({checked:false});
      const mnl=document.getElementById('mNotesLbl');
      if(mnl) mnl.innerHTML='📝 Door Notes: <span style="color:var(--red)">Required</span>';
      const mn=document.getElementById('mNotes');
      if(mn) mn.placeholder='Any additional info including who approved them (Sam, Daniel & LouLou are the only ones who can)';
      updateAddWbPills();
    }
    function doAdd(){
      const name=document.getElementById('aN').value.trim();
      if(!name){alert('Guest name required');return;}
      const btn=document.getElementById('addBtn');
      btn.textContent='Adding…';
      const mSTI=document.getElementById('mSTI');
      const stiOn=!!(mSTI&&mSTI.checked);
      const wb=[];
      if(stiOn) wb.push('Black');
      const id='mock-'+Date.now();
      const g=normalizeMockGuest({
        id,
        name,
        checkedIn:!!document.getElementById('mCI').checked,
        rsvp:'',
        photo:face((Date.now()%70)+1),
        list:'Guest',
        nda:document.getElementById('mNDA').checked?'Signed':'No',
        phone:'555-0199',
        wristband:stiOn?'Black':'',
        email:'',
      });
      g.wristbands=wb;
      g.stiVerified=stiOn;
      const coat=document.getElementById('mCoat').value.trim();
      const phoneChk=document.getElementById('mPhoneCheck')?document.getElementById('mPhoneCheck').value.trim():'';
      const notes=document.getElementById('mNotes').value.trim();
      local[id]={coat,notes,phoneCheck:phoneChk};
      g.coatCheck=coat;
      g.phoneCheckNum=phoneChk;
      g.doorNotes=notes;
      guests.push(g);
      guests=sortGuestsByName(guests);
      closeAdd();
      render();
      showToast('Added (practice) ✓');
      btn.textContent='Add Guest';
    }
    if(EVENTS.length===1) pickEv(0);
    else{ ensureLandingSubtitle(); buildEvList(); }
  </script>

</body>
</html>
